name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v0.0.1'
  push:
    # run only against version tags
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build_and_release_project:
    name: Build and Release Project - ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: write  # needed to create GH Release
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing to PyPI

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Setup python for build
        run: |
          uv python install
          uv sync --group build --dev

      - name: Setup and run test suite
        run: uvx tox -vv -e test

      # build and upload Python packages
      - name: Install Hatch
        run: uvx pipx install hatch

      - name: Build dist artifacts
        run: hatch build

      # PyPI Release
      # required instead of using hatch due to usage of trusted publishers
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true
          attestations: false

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true

      # Github Release
      - name: Create Github Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

#############

  build_and_push_container:
    name: Build and Push Container - ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release

    permissions:
      packages: write  # required for pushing image to GHCR

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to Github Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: |
            magneticstain/plexer
            ghcr.io/${{ github.repository }}

      # required for multi-platform builds (e.g. arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      # explicitly required for automatic SBOM generation and provenance attestation
      # REF: https://docs.docker.com/guides/gha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Validate Docker build configuration
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          call: check

      # required for reproducible builds
      # REF: https://docs.docker.com/build/ci/github-actions/reproducible-builds/
      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Generate artifact attestation for GHCR container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: "sbom.spdx.json"  # REF: https://docs.docker.com/build/metadata/attestations/sbom/#verify-sbom-attestations
          push-to-registry: true
