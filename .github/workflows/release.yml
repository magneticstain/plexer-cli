name: Release

on:
  push:
    # run only against version tags
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Generate New Release - ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release

    permissions:
      attestations: write
      contents: write  # needed to create GH Release
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing to PyPI
      packages: write  # required for pushing image to GHCR
    
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
      
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Setup python for build
        run: uv python install

      # run tests
      - name: Install build deps
        run: uv sync --group build --dev

      - name: Setup test suite
        run: uvx tox -vv --notest -e test

      - name: Run test suite
        run: uvx tox --skip-pkg-install -e test
      
      # build and publish
      - name: Install Hatch
        run: uvx pipx install hatch

      - name: Build dist artifacts
        run: hatch build
      
      # PyPI Release
      # required instead of using hatch due to usage of trusted publishers
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          attestations: true
      
      # Github Release
      - name: Create Github Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.5.0
        with:
          name: 
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
      
      # Docker Release
      # REF: https://docs.github.com/en/actions/use-cases-and-examples/publishing-packages/publishing-docker-images#publishing-images-to-docker-hub-and-github-packages
      ## Uploads to Docker.io and ghcr.io (GitHub Container Registry)
      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Log in to Github Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: |
            magneticstain/plexer-cli
            ghcr.io/${{ github.repository }}

      - name: Build and push Docker images to all registries
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # - name: Generate artifact attestation
      #   uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c  # v1.4.3
      #   with:
      #     subject-name: ghcr.io/${{ github.repository }}
      #     subject-digest: ${{ steps.push.outputs.digest }}
      #     push-to-registry: true
      